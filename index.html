<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tweakbasecoat — visual theme editor for Basecoat</title>
  <!-- Tailwind v4 browser JIT: compiles whatever raw utility classes appear in the DOM
       (incl. the injected kitchen-sink: grid/gap/flex/etc.) at runtime — zero build step. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Register the chart colors in the JIT theme so bg-chart-*/text-chart-* utilities are
       emitted; `inline` makes them reference the live --chart-* vars our presets/apply set. -->
  <style type="text/tailwindcss">
    @theme inline {
      --color-chart-1: var(--chart-1);
      --color-chart-2: var(--chart-2);
      --color-chart-3: var(--chart-3);
      --color-chart-4: var(--chart-4);
      --color-chart-5: var(--chart-5);
    }
  </style>
  <!-- Basecoat components + theme: self-contained CDN pack bundle, swapped on pack change. -->
  <link id="basecoat-style" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.1/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="./app.css" />
  <script type="module" src="./app.js"></script>
</head>
<body x-data="editor" :class="{ 'dark': mode === 'dark', 'shadows-on': shadowsOn }">
  <div class="tb-layout">
    <!-- ───────────────── Controls ───────────────── -->
    <aside class="tb-panel">
      <header class="tb-panel-head">
        <h1 class="text-lg font-semibold">tweakbasecoat</h1>
        <p class="text-muted-foreground text-sm">visual theme editor for Basecoat</p>
      </header>

      <div class="tb-theme" @click.outside="themeOpen = false">
        <label class="text-sm font-medium">Theme</label>
        <button class="tb-theme-btn" @click="themeOpen = !themeOpen">
          <span class="tb-dots">
            <template x-for="(c, i) in swatch(presets.find(p => p.name === themeName) || presets[0])" :key="i">
              <i :style="`background:${c}`"></i>
            </template>
          </span>
          <span class="flex-1 text-left text-sm" x-text="themeName"></span>
          <span class="text-muted-foreground">▾</span>
        </button>
        <div class="tb-theme-menu" x-show="themeOpen" x-cloak>
          <input class="input tb-theme-search" type="text" placeholder="Search themes…" x-model="themeQuery" />
          <div class="tb-theme-list">
            <template x-for="p in presets.filter(p => p.name.toLowerCase().includes((themeQuery||'').toLowerCase()))" :key="p.slug">
              <button class="tb-theme-item" :class="{ 'is-active': p.name === themeName }" @click="loadPreset(p)">
                <span class="tb-dots">
                  <template x-for="(c, i) in swatch(p)" :key="i"><i :style="`background:${c}`"></i></template>
                </span>
                <span class="text-sm" x-text="p.name"></span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <div class="tb-row">
        <label>Style pack</label>
        <select x-model="pack" @change="setPack()">
          <template x-for="p in packs" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
      </div>

      <div class="tb-row">
        <label>Mode</label>
        <button class="tb-mode-toggle" @click="toggleMode()">
          <span x-text="mode === 'dark' ? '🌙' : '☀️'"></span>
          <span x-text="mode === 'dark' ? 'Dark' : 'Light'"></span>
        </button>
      </div>

      <div class="tb-row">
        <label>Radius</label>
        <input type="range" min="0" max="1.5" step="0.025" x-model="radius" @input="apply()" />
        <span x-text="radius + 'rem'"></span>
      </div>

      <hr />

      <div class="tb-glabel">Colors</div>
      <div class="tb-colors">
        <template x-for="key in colorKeys" :key="key">
          <label class="tb-color">
            <input type="color" :value="hexOf(key)" @input="setColor(key, $event.target.value)" />
            <span x-text="key"></span>
          </label>
        </template>
      </div>

      <hr class="my-2" />

      <details class="tb-section" open>
        <summary class="text-sm font-medium">Typography</summary>
        <template x-for="key in ['font-sans','font-heading','font-mono']" :key="key">
          <div class="tb-row">
            <label class="text-xs text-muted-foreground" x-text="key.replace('font-','')"></label>
            <select class="select" :value="fontFamily(key)" @change="setFont(key, $event.target.value)">
              <template x-for="f in fontMenus[key]" :key="f">
                <option :value="f" x-text="f"></option>
              </template>
            </select>
          </div>
        </template>
        <div class="tb-row">
          <label class="text-xs text-muted-foreground">letter spacing</label>
          <input type="range" min="-0.05" max="0.1" step="0.005"
                 :value="parseFloat(tok('tracking-normal','0em'))"
                 @input="setTok('tracking-normal', $event.target.value + 'em')" />
          <span class="text-xs text-muted-foreground" x-text="tok('tracking-normal','0em')"></span>
        </div>
      </details>

      <hr class="my-2" />

      <div class="tb-section">
        <div class="tb-shadow-head">
          <span class="tb-glabel">Shadow</span>
          <button class="tb-switch" :class="{ 'is-on': shadowsOn }" @click="toggleShadows()"
                  :aria-pressed="shadowsOn" title="Basecoat is flat by default; enable to opt into elevation">
            <span class="tb-switch-knob"></span>
          </button>
        </div>
        <template x-if="!shadowsOn">
          <p class="tb-hint">Basecoat cards are flat. Enable to add elevation (exported as an optional override).</p>
        </template>
        <div x-show="shadowsOn" class="tb-section">
          <label class="tb-color">
            <input type="color" :value="shadowColorHex()" @input="setTok('shadow-color', $event.target.value)" />
            <span>color</span>
          </label>
          <div class="tb-row">
            <label>opacity</label>
            <input type="range" min="0" max="1" step="0.01" :value="parseFloat(tok('shadow-opacity','0.1'))"
                   @input="setTok('shadow-opacity', $event.target.value)" />
            <span x-text="tok('shadow-opacity','0.1')"></span>
          </div>
          <template x-for="s in [['shadow-blur','blur',0,30],['shadow-spread','spread',-10,10],['shadow-offset-x','offset x',-20,20],['shadow-offset-y','offset y',-20,20]]" :key="s[0]">
            <div class="tb-row">
              <label x-text="s[1]"></label>
              <input type="range" :min="s[2]" :max="s[3]" step="1" :value="shadowNum(s[0])"
                     @input="setShadowPx(s[0], $event.target.value)" />
              <span x-text="shadowNum(s[0]) + 'px'"></span>
            </div>
          </template>
        </div>
      </div>

      <hr class="my-2" />

      <div class="tb-actions">
        <button class="tb-primary" @click="copyCss()" x-text="copied ? 'Copied!' : 'Copy theme.css'"></button>
        <button class="tb-ghost" @click="reset()">Reset</button>
      </div>
    </aside>

    <!-- ───────────────── Preview ───────────────── -->
    <!-- Basecoat's own homepage kitchen-sink, lifted verbatim and injected at runtime. -->
    <main class="tb-preview" id="preview"></main>
  </div>
</body>
</html>
