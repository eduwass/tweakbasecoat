<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tweakbasecoat — visual theme editor for Basecoat</title>
  <!-- Tailwind v4 browser JIT: compiles whatever raw utility classes appear in the DOM
       (incl. the injected kitchen-sink: grid/gap/flex/etc.) at runtime — zero build step. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Basecoat components + theme: self-contained CDN pack bundle, swapped on pack change. -->
  <link id="basecoat-style" rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.1/dist/basecoat.cdn.min.css" />
  <link rel="stylesheet" href="./app.css" />
  <script type="module" src="./app.js"></script>
</head>
<body x-data="editor" :class="{ 'dark': mode === 'dark' }">
  <div class="tb-layout">
    <!-- ───────────────── Controls ───────────────── -->
    <aside class="tb-panel">
      <header class="tb-panel-head">
        <h1 class="text-lg font-semibold">tweakbasecoat</h1>
        <p class="text-muted-foreground text-sm">visual theme editor for Basecoat</p>
      </header>

      <div class="tb-theme" @click.outside="themeOpen = false">
        <label class="text-sm font-medium">Theme</label>
        <button class="tb-theme-btn" @click="themeOpen = !themeOpen">
          <span class="tb-dots">
            <template x-for="(c, i) in swatch(presets.find(p => p.name === themeName) || presets[0])" :key="i">
              <i :style="`background:${c}`"></i>
            </template>
          </span>
          <span class="flex-1 text-left text-sm" x-text="themeName"></span>
          <span class="text-muted-foreground">▾</span>
        </button>
        <div class="tb-theme-menu" x-show="themeOpen" x-cloak>
          <input class="input tb-theme-search" type="text" placeholder="Search themes…" x-model="themeQuery" />
          <div class="tb-theme-list">
            <template x-for="p in presets.filter(p => p.name.toLowerCase().includes((themeQuery||'').toLowerCase()))" :key="p.slug">
              <button class="tb-theme-item" :class="{ 'is-active': p.name === themeName }" @click="loadPreset(p)">
                <span class="tb-dots">
                  <template x-for="(c, i) in swatch(p)" :key="i"><i :style="`background:${c}`"></i></template>
                </span>
                <span class="text-sm" x-text="p.name"></span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <div class="tb-row">
        <label class="text-sm font-medium">Style pack</label>
        <select class="select" x-model="pack" @change="setPack()">
          <template x-for="p in packs" :key="p">
            <option :value="p" x-text="p"></option>
          </template>
        </select>
      </div>

      <div class="tb-row">
        <label class="text-sm font-medium">Mode</label>
        <button class="btn-outline" @click="toggleMode()" x-text="mode === 'dark' ? 'Dark' : 'Light'"></button>
      </div>

      <div class="tb-row">
        <label class="text-sm font-medium">Radius</label>
        <input type="range" min="0" max="1.5" step="0.025" x-model="radius" @input="apply()" />
        <span class="text-muted-foreground text-xs" x-text="radius + 'rem'"></span>
      </div>

      <hr class="my-2" />

      <div class="tb-colors">
        <template x-for="key in colorKeys" :key="key">
          <label class="tb-color">
            <input type="color" :value="hexOf(key)" @input="setColor(key, $event.target.value)" />
            <span class="text-sm" x-text="key"></span>
          </label>
        </template>
      </div>

      <div class="tb-actions">
        <button class="btn" @click="copyCss()" x-text="copied ? 'Copied!' : 'Copy theme.css'"></button>
        <button class="btn-outline" @click="reset()">Reset</button>
      </div>
    </aside>

    <!-- ───────────────── Preview ───────────────── -->
    <!-- Basecoat's own homepage kitchen-sink, lifted verbatim and injected at runtime. -->
    <main class="tb-preview" id="preview"></main>
  </div>
</body>
</html>
